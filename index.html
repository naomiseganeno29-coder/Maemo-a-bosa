<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>

    <title>Maemo a bosa</title>

</head>
<body>
    <div class="weather-app">
    <header>
     <form id="form">
        <input type="search" placeholder="Enter a city..." required id="search-city"/>
        <input type="submit" value="Search"/>
     </form>
    </header>
    <main>
        <div class="info">
        <h1>Rustenburg</h1>
        <p >
            <span class="date">Thursday <strong>10:29</strong></span>,<span id="description">Partly cloudy</span>
            <br/>
            Humidity: <strong id="Humidity">29%</strong>,Wind:<strong id="speed">5km/h</strong>
        </p>
         </div>
         <div class="degree">
            <span class="degree-emoji"> 🌤️</span>
            <span class="degree-number" id="number">29 </span>
            <span class="degree-icon" >°C </span>
            
         </div>
    </main>
     <hr/>
    <footer>
        <p>
          Coded by
          <a href="https://github.com/naomiseganeno29-coder" target="_blank">Naomi Seganeno</a> is
          <a href="https://github.com/naomiseganeno29-coder/Maemo-a-bosa" target="_blank"> open-sourced on GitHub</a> and
          <a href="https://maemo-a-bosa.netlify.app/">hosted on Netlify</a>
          
        </p>
    </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
